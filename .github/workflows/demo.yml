name: Dados de exemplo

# Botão manual em Actions → "Dados de exemplo" → Run workflow.
# seed: cria 10 crianças fictícias | clear: remove só elas (as reais não são tocadas).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "seed (criar) ou clear (apagar)"
        required: true
        type: choice
        options: [seed, clear]

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          ACTION: ${{ inputs.action }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ACTION
          script: docker exec filhos_do_ritmo node --disable-warning=ExperimentalWarning scripts/demo.mjs "$ACTION"
